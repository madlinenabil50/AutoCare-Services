<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb text-white-50">
          <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Home</a></li>
          <li class="breadcrumb-item"><a href="spare-parts.html" class="text-white-50">Spare Parts</a></li>
          <li class="breadcrumb-item active text-white" aria-current="page">Details</li>
        </ol>
      </nav>
      <h1>Product details</h1>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div id="productDetailContainer"></div>

      <div class="mt-5">
        <h3 class="mb-4">Related products</h3>
        <div class="row g-4" id="relatedProductsContainer"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');
      window.renderProductDetail(productId || window.productCatalog[0].id);
    });
  </script>
</body>
</html>
