<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <h1>Customer dashboard</h1>
      <p class="mb-0 text-white-50">Track bookings, orders, and your profile from one place.</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card p-4 mb-4">
            <h3 class="mb-3">Profile</h3>
            <div id="profileInfo"></div>
            <button id="editProfileBtn" class="btn btn-outline-primary mt-3" type="button">Edit profile</button>
          </div>
          <div class="card p-4">
            <h3 class="mb-3">Quick links</h3>
            <div class="d-grid gap-2">
              <a href="my-bookings.html" class="btn btn-outline-primary">My bookings</a>
              <a href="my-orders.html" class="btn btn-outline-primary">My orders</a>
              <button type="button" id="logoutDemoBtn" class="btn btn-outline-danger">Logout</button>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card p-4 mb-4">
            <h3 class="mb-3">Upcoming maintenance bookings</h3>
            <div id="upcomingBookings"></div>
          </div>
          <div class="card p-4">
            <h3 class="mb-3">Recent order activity</h3>
            <div id="accountOrders"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/account.js"></script>
  <script src="js/common.js"></script>
  <script>
    function renderProfile() {
      const profileInfo = document.getElementById('profileInfo');
      const session = window.getDemoSession();
      if (!session) {
        profileInfo.innerHTML = `<p class="mb-0">Please log in to view your account details.</p>`;
        return;
      }

      profileInfo.innerHTML = `
        <div class="mb-3"><strong>Name:</strong> ${session.name}</div>
        <div class="mb-3"><strong>Email:</strong> ${session.email}</div>
        <div class="mb-3"><strong>Phone:</strong> ${session.phone}</div>
      `;
    }

    function renderUpcomingBookings() {
      const container = document.getElementById('upcomingBookings');
      const bookings = window.getStorage('omc_demo_bookings', []);
      if (!bookings.length) {
        container.innerHTML = `<div class="empty-state"><p class="mb-0">No upcoming bookings yet. <a href="book-service.html">Book a service</a></p></div>`;
        return;
      }

      const now = new Date();
      const upcoming = bookings.filter((booking) => new Date(booking.preferredDate) >= new Date(now.toDateString()));
      if (!upcoming.length) {
        container.innerHTML = `<div class="empty-state"><p class="mb-0">No upcoming bookings found.</p></div>`;
        return;
      }

      container.innerHTML = upcoming.slice(0, 3).map((booking) => `
        <div class="border rounded p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>${booking.reference}</strong>
            <span class="badge bg-success">${booking.status}</span>
          </div>
          <div class="text-muted">${booking.selectedService}</div>
          <div class="small text-muted">${booking.preferredDate} at ${booking.preferredTime}</div>
          <div class="small text-muted">${booking.preferredCenter}</div>
        </div>
      `).join('');
    }

    function renderAccountOrders() {
      const container = document.getElementById('accountOrders');
      const orders = window.getStorage('omc_demo_orders', []);
      if (!orders.length) {
        container.innerHTML = `<div class="empty-state"><p class="mb-0">No recent orders yet.</p></div>`;
        return;
      }

      container.innerHTML = orders.slice(0, 3).map((order) => `
        <div class="border rounded p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>${order.orderNumber}</strong>
            <span class="badge bg-primary">${order.status}</span>
          </div>
          <div class="small text-muted">${new Date(order.createdAt).toLocaleDateString()} · ${order.paymentMethod}</div>
          <div class="small text-muted">Total: ${window.formatCurrency(order.total)}</div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', function () {
      const session = window.getDemoSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      renderProfile();
      renderUpcomingBookings();
      renderAccountOrders();

      document.getElementById('logoutDemoBtn').addEventListener('click', () => {
        window.localStorage.removeItem('omc_demo_session');
        window.location.href = 'index.html';
      });

      document.getElementById('editProfileBtn').addEventListener('click', () => {
        window.showNotification('Profile editing is a demo feature. Connect a backend to store real customer profile data.', 'warning');
      });
    });
  </script>
</body>
</html>
