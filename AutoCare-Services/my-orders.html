<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <h1>My orders</h1>
      <p class="mb-0 text-white-50">Order tracking and delivery status for your spare-parts purchases.</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <h3 class="mb-0">Demo order history</h3>
          <a href="spare-parts.html" class="btn btn-primary">Shop more parts</a>
        </div>
        <div id="ordersContainer"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/common.js"></script>
  <script>
    function renderOrders() {
      const container = document.getElementById('ordersContainer');
      const orders = window.getStorage('omc_demo_orders', []);

      if (!orders.length) {
        container.innerHTML = `<div class="empty-state"><p class="mb-0">No demo orders have been placed yet.</p></div>`;
        return;
      }

      container.innerHTML = orders.map((order) => `
        <div class="border rounded p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <div>
              <h5 class="mb-1">${order.orderNumber}</h5>
              <div class="text-muted">Placed on ${new Date(order.createdAt).toLocaleDateString()}</div>
            </div>
            <span class="badge bg-success">${order.status}</span>
          </div>
          <div class="row g-3">
            <div class="col-md-6"><strong>Payment:</strong> ${order.paymentMethod}</div>
            <div class="col-md-6"><strong>Delivery:</strong> ${order.deliveryMethod}</div>
            <div class="col-md-6"><strong>Address:</strong> ${order.deliveryAddress}</div>
            <div class="col-md-6"><strong>Total:</strong> ${window.formatCurrency(order.total)}</div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', function () {
      const session = window.getDemoSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      renderOrders();
    });
  </script>
</body>
</html>
