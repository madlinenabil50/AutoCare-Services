<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb text-white-50">
          <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Home</a></li>
          <li class="breadcrumb-item"><a href="cart.html" class="text-white-50">Cart</a></li>
          <li class="breadcrumb-item active text-white" aria-current="page">Checkout</li>
        </ol>
      </nav>
      <h1>Checkout</h1>
      <p class="mb-0 text-white-50">Complete your order and review the demo payment options before confirmation.</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card p-4">
            <h3 class="mb-4">Delivery information</h3>
            <form id="checkoutForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="checkoutName" class="form-label">Full name</label>
                  <input id="checkoutName" class="form-control" type="text" required />
                </div>
                <div class="col-md-6">
                  <label for="checkoutPhone" class="form-label">Phone number</label>
                  <input id="checkoutPhone" class="form-control" type="tel" required />
                </div>
                <div class="col-12">
                  <label for="checkoutAddress" class="form-label">Delivery address</label>
                  <textarea id="checkoutAddress" class="form-control" rows="3" required></textarea>
                </div>
                <div class="col-md-6">
                  <label for="checkoutCity" class="form-label">City</label>
                  <select id="checkoutCity" class="form-select" required>
                    <option value="">Select city</option>
                    <option value="Cairo">Cairo</option>
                    <option value="Alexandria">Alexandria</option>
                    <option value="Riyadh">Riyadh</option>
                    <option value="Jeddah">Jeddah</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="checkoutArea" class="form-label">Area</label>
                  <input id="checkoutArea" class="form-control" type="text" required />
                </div>
                <div class="col-12">
                  <label for="deliveryMethod" class="form-label">Delivery method</label>
                  <select id="deliveryMethod" class="form-select" required>
                    <option value="">Select method</option>
                    <option value="Standard Delivery">Standard Delivery</option>
                    <option value="Express Delivery">Express Delivery</option>
                    <option value="Pickup from Center">Pickup from Center</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label">Payment method</label>
                  <div class="border rounded p-3">
                    <div class="form-check mb-2">
                      <input class="form-check-input" type="radio" name="paymentMethod" id="codMethod" value="Cash on Delivery" checked />
                      <label class="form-check-label" for="codMethod">Cash on Delivery</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="paymentMethod" id="cardMethod" value="Demo Card Payment" />
                      <label class="form-check-label" for="cardMethod">Demo Card Payment (simulation only)</label>
                    </div>
                  </div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-lg mt-4">Place order</button>
            </form>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="summary-box">
            <h4 class="mb-3">Order summary</h4>
            <div id="checkoutSummary"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/common.js"></script>
  <script>
    function loadCheckoutSummary() {
      const cart = window.getStorage('omc_cart', []);
      const summary = document.getElementById('checkoutSummary');
      if (!summary) return;

      if (!cart.length) {
        summary.innerHTML = `
          <div class="empty-state">
            <p class="mb-0">Your cart is empty. Add products before checkout.</p>
          </div>
        `;
        return;
      }

      let subtotal = 0;
      const itemsHtml = cart.map((item) => {
        const product = window.getProductById(item.productId);
        if (!product) return '';
        subtotal += product.price * item.quantity;
        return `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <div class="fw-semibold">${product.name}</div>
              <small class="text-muted">Qty: ${item.quantity}</small>
            </div>
            <span>${window.formatCurrency(product.price * item.quantity)}</span>
          </div>
        `;
      }).join('');

      const shippingFee = subtotal > 0 ? 150 : 0;
      const total = subtotal + shippingFee;

      summary.innerHTML = `
        ${itemsHtml}
        <div class="summary-item mt-3"><span>Subtotal</span><span>${window.formatCurrency(subtotal)}</span></div>
        <div class="summary-item"><span>Shipping fee</span><span>${window.formatCurrency(shippingFee)}</span></div>
        <div class="summary-item fw-bold"><span>Total</span><span>${window.formatCurrency(total)}</span></div>
      `;
    }

    document.addEventListener('DOMContentLoaded', function () {
      loadCheckoutSummary();

      const form = document.getElementById('checkoutForm');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const cart = window.getStorage('omc_cart', []);

        if (!cart.length) {
          window.showNotification('Add a product to cart before placing an order.', 'error');
          return;
        }

        const fields = {
          name: document.getElementById('checkoutName').value.trim(),
          phone: document.getElementById('checkoutPhone').value.trim(),
          address: document.getElementById('checkoutAddress').value.trim(),
          city: document.getElementById('checkoutCity').value,
          area: document.getElementById('checkoutArea').value.trim(),
          deliveryMethod: document.getElementById('deliveryMethod').value
        };

        const phonePattern = /^[\+?\d[\d\s-]{7,}$/;
        if (!fields.name || !fields.phone || !fields.address || !fields.city || !fields.area || !fields.deliveryMethod) {
          window.showNotification('Please complete all checkout fields.', 'error');
          return;
        }

        if (!phonePattern.test(fields.phone)) {
          window.showNotification('Please enter a valid phone number.', 'error');
          return;
        }

        const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || 'Cash on Delivery';
        const subtotal = cart.reduce((sum, item) => {
          const product = window.getProductById(item.productId);
          return sum + (product ? product.price * item.quantity : 0);
        }, 0);
        const shippingFee = subtotal > 0 ? 150 : 0;
        const total = subtotal + shippingFee;

        const orderNumber = `ORD-${Math.random().toString(16).slice(2, 8).toUpperCase()}`;
        const order = {
          id: window.generateDemoId('order'),
          orderNumber,
          createdAt: new Date().toISOString(),
          status: 'Processing',
          paymentMethod,
          deliveryMethod: fields.deliveryMethod,
          deliveryAddress: `${fields.address}, ${fields.area}, ${fields.city}`,
          customerName: fields.name,
          phone: fields.phone,
          items: cart,
          subtotal,
          shippingFee,
          total
        };

        const savedOrders = window.getStorage('omc_demo_orders', []);
        savedOrders.unshift(order);
        window.setStorage('omc_demo_orders', savedOrders);
        window.setStorage('omc_cart', []);
        window.updateNavCartCount();

        form.reset();
        loadCheckoutSummary();
        window.showNotification(`Order created successfully. Reference: ${orderNumber}`, 'success');

        setTimeout(() => {
          window.location.href = 'my-orders.html';
        }, 1200);
      });
    });
  </script>
</body>
</html>
