<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance Services | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb text-white-50">
          <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Home</a></li>
          <li class="breadcrumb-item active text-white" aria-current="page">Services</li>
        </ol>
      </nav>
      <h1>Vehicle maintenance services</h1>
      <p class="mb-0 text-white-50">Fast, professional support for everyday care and preventive maintenance.</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="filter-bar mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-lg-5 col-md-6">
            <label for="serviceSearch" class="form-label">Search service</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="serviceSearch" type="search" class="form-control" placeholder="Search by service or keyword" />
            </div>
          </div>
          <div class="col-lg-4 col-md-6">
            <label for="serviceCategory" class="form-label">Category</label>
            <select id="serviceCategory" class="form-select"></select>
          </div>
          <div class="col-lg-3 col-md-12">
            <button id="clearServiceFilters" class="btn btn-outline-primary w-100" type="button">Clear filters</button>
          </div>
        </div>
      </div>

      <div class="row g-4" id="serviceCatalogContainer"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/services.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const categorySelect = document.getElementById('serviceCategory');
      const searchInput = document.getElementById('serviceSearch');
      const clearBtn = document.getElementById('clearServiceFilters');

      const categories = window.getServiceCategories();
      categorySelect.innerHTML = categories.map((category) => `<option value="${category}">${category}</option>`).join('');

      function applyFilters() {
        const category = categorySelect.value;
        const query = searchInput.value;
        window.renderFilteredServices(query, category, 'serviceCatalogContainer');
      }

      searchInput.addEventListener('input', applyFilters);
      categorySelect.addEventListener('change', applyFilters);
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        categorySelect.value = 'All';
        applyFilters();
      });

      applyFilters();
    });
  </script>
</body>
</html>
