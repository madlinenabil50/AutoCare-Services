<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <h1>Create account</h1>
      <p class="mb-0 text-white-50">Demo registration for front-end functionality. Passwords are not stored as plain text.</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          <div class="card p-4">
            <h3 class="mb-4">Register as a customer</h3>
            <form id="registerForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="registerName">Full name</label>
                  <input id="registerName" class="form-control" type="text" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="registerPhone">Phone</label>
                  <input id="registerPhone" class="form-control" type="tel" required />
                </div>
                <div class="col-12">
                  <label class="form-label" for="registerEmail">Email</label>
                  <input id="registerEmail" class="form-control" type="email" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="registerPassword">Password</label>
                  <div class="password-toggle">
                    <input id="registerPassword" class="form-control" type="password" required />
                    <button type="button" class="toggle-btn" data-password-toggle="registerPassword"><i class="bi bi-eye"></i></button>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="confirmPassword">Confirm password</label>
                  <div class="password-toggle">
                    <input id="confirmPassword" class="form-control" type="password" required />
                    <button type="button" class="toggle-btn" data-password-toggle="confirmPassword"><i class="bi bi-eye"></i></button>
                  </div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-4">Create demo account</button>
              <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login here</a></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth-demo.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('registerForm');
      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const name = document.getElementById('registerName').value.trim();
        const phone = document.getElementById('registerPhone').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const users = window.getStorage('omc_demo_users', []);

        if (!name || !phone || !email || !password || !confirmPassword) {
          window.showNotification('Please fill in all required fields.', 'error');
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          window.showNotification('Please enter a valid email address.', 'error');
          return;
        }

        if (password.length < 6) {
          window.showNotification('Password must be at least 6 characters long.', 'error');
          return;
        }

        if (password !== confirmPassword) {
          window.showNotification('Passwords do not match.', 'error');
          return;
        }

        if (users.some((user) => user.email.toLowerCase() === email.toLowerCase())) {
          window.showNotification('An account with this email already exists.', 'error');
          return;
        }

        const hashedPassword = 'demo-hash';
        users.push({ name, phone, email, passwordHash: hashedPassword });
        window.setStorage('omc_demo_users', users);

        const session = { name, email, phone };
        window.setStorage('omc_demo_session', session);
        window.showNotification('Demo registration successful.', 'success');
        setTimeout(() => {
          window.location.href = 'my-account.html';
        }, 1000);
      });

      document.querySelectorAll('[data-password-toggle]').forEach((button) => {
        button.addEventListener('click', function () {
          const target = document.getElementById(button.getAttribute('data-password-toggle'));
          const isPassword = target.type === 'password';
          target.type = isPassword ? 'text' : 'password';
          button.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
      });
    });
  </script>
</body>
</html>
