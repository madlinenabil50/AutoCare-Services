<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <h1>My bookings</h1>
      <p class="mb-0 text-white-50">Demo appointment tracker for your service history and upcoming visits.</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <h3 class="mb-0">Demo bookings</h3>
          <a href="book-service.html" class="btn btn-primary">Book new service</a>
        </div>
        <div id="bookingsContainer"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    function renderBookings() {
      const container = document.getElementById('bookingsContainer');
      const bookings = window.getStorage('omc_demo_bookings', []);

      if (!bookings.length) {
        container.innerHTML = `<div class="empty-state"><p class="mb-0">No demo bookings have been created yet.</p></div>`;
        return;
      }

      container.innerHTML = bookings.map((booking) => `
        <div class="border rounded p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
              <h5 class="mb-1">${booking.reference}</h5>
              <div class="text-muted">${booking.selectedService}</div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-primary">${booking.status}</span>
              <button type="button" class="btn btn-outline-danger btn-sm cancel-booking-btn" data-booking-id="${booking.id}">Cancel</button>
            </div>
          </div>
          <div class="row g-3 mt-2">
            <div class="col-md-6"><strong>Customer:</strong> ${booking.customerName}</div>
            <div class="col-md-6"><strong>Phone:</strong> ${booking.phoneNumber}</div>
            <div class="col-md-6"><strong>Vehicle:</strong> ${booking.vehicleModel}</div>
            <div class="col-md-6"><strong>Registration:</strong> ${booking.registrationNumber}</div>
            <div class="col-md-6"><strong>Date:</strong> ${booking.preferredDate}</div>
            <div class="col-md-6"><strong>Time:</strong> ${booking.preferredTime}</div>
            <div class="col-md-6"><strong>Center:</strong> ${booking.preferredCenter}</div>
            <div class="col-md-6"><strong>Notes:</strong> ${booking.additionalNotes || 'None'}</div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.cancel-booking-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const bookingId = button.getAttribute('data-booking-id');
          const updated = bookings.filter((booking) => booking.id !== bookingId);
          window.setStorage('omc_demo_bookings', updated);
          renderBookings();
          window.showNotification('Demo booking cancelled successfully.', 'success');
        });
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      const session = window.getDemoSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      renderBookings();
    });
  </script>
</body>
</html>
