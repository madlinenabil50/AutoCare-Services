<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spare Parts Catalog | AutoCare Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="site-navbar"></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <header class="page-header">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb text-white-50">
          <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Home</a></li>
          <li class="breadcrumb-item active text-white" aria-current="page">Spare Parts</li>
        </ol>
      </nav>
      <h1>Spare parts catalog</h1>
      <p class="mb-0 text-white-50">Find quality automotive components for performance, safety, and long-term reliability.</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="filter-bar mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-lg-4 col-md-6">
            <label for="productSearch" class="form-label">Search</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="productSearch" class="form-control" type="search" placeholder="Search by name or code" />
            </div>
          </div>
          <div class="col-lg-3 col-md-6">
            <label for="productCategory" class="form-label">Category</label>
            <select id="productCategory" class="form-select"></select>
          </div>
          <div class="col-lg-2 col-md-6">
            <label for="sortProducts" class="form-label">Sort</label>
            <select id="sortProducts" class="form-select">
              <option value="featured">Featured</option>
              <option value="price-low-high">Price: Low to High</option>
              <option value="price-high-low">Price: High to Low</option>
            </select>
          </div>
          <div class="col-lg-1 col-md-12">
            <button id="clearProductFilters" class="btn btn-outline-primary w-100" type="button">Reset</button>
          </div>
        </div>
      </div>

      <div class="row g-4" id="productGrid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const categorySelect = document.getElementById('productCategory');
      const searchInput = document.getElementById('productSearch');
      const sortSelect = document.getElementById('sortProducts');
      const clearBtn = document.getElementById('clearProductFilters');

      categorySelect.innerHTML = ['<option value="All">All categories</option>']
        .concat(window.getProductCategoryOptions().map((category) => `<option value="${category}">${category}</option>`))
        .join('');

      const params = new URLSearchParams(window.location.search);
      const queryParam = params.get('query') || '';
      const categoryParam = params.get('category') || 'All';
      if (queryParam) searchInput.value = queryParam;
      if (categoryParam && categoryParam !== 'All') categorySelect.value = categoryParam;

      function applyFilters() {
        const filtered = window.getFilteredProducts({
          query: searchInput.value,
          category: categorySelect.value,
          sort: sortSelect.value
        });
        window.renderProductGrid(filtered, 'productGrid');
      }

      searchInput.addEventListener('input', applyFilters);
      categorySelect.addEventListener('change', applyFilters);
      sortSelect.addEventListener('change', applyFilters);
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        categorySelect.value = 'All';
        sortSelect.value = 'featured';
        applyFilters();
      });

      applyFilters();
    });
  </script>
</body>
</html>
